# Source of Truth - Paramètres réseau

as_hq: 65001
as_branch: 65002

router_a_wan_ip: "172.20.0.5"
router_b_wan_ip: "172.20.0.2"

net_a_prefix: "10.10.1.0/24"
net_b_prefix: "10.10.2.0/24"
wan_prefix: "172.20.0.0/27"


routers:

  - hostname: router-a
    name: router-a
    as: "{{ as_hq }}"
    id: "1.1.1.1"
    peer_as: "{{ as_branch }}"
    peer_ip: "{{ router_b_wan_ip }}"
    prefix: "{{ net_a_prefix }}"
    lan_ip: "10.10.1.4"
    wan_ip: "{{ router_a_wan_ip }}"
    lan_network: net-a

  - hostname: router-b
    name: router-b
    as: "{{ as_branch }}"
    id: "2.2.2.2"
    peer_as: "{{ as_hq }}"
    peer_ip: "{{ router_a_wan_ip }}"
    prefix: "{{ net_b_prefix }}"
    lan_ip: "10.10.2.2"
    wan_ip: "{{ router_b_wan_ip }}"
    lan_network: net-b


lab_hosts:

  - name: host-a
    ip: "10.10.1.100"
    gateway: "10.10.1.4"
    network: net-a

  - name: host-b
    ip: "10.10.2.100"
    gateway: "10.10.2.2"
    network: net-b


services:

  - name: web
    ip: "10.10.1.10"
    network: net-a

  - name: dns
    ip: "10.10.1.53"
    network: net-a
