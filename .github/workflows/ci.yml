name: CI — Network Infrastructure Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml

      - name: Validate Docker Compose
        run: docker compose -f infra/docker-compose.yml config

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose -f infra/docker-compose.yml build

  test:
    name: Network Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Install Ansible & Docker collection
        run: |
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Deploy infrastructure
        run: |
          make up
          sleep 30  # Attente de la convergence BGP

      - name: Run network tests
        run: make test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/

      - name: Teardown
        if: always()
        run: make down
